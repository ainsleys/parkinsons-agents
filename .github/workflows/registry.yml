name: registry-refresh
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Pull registry records and site lists
        run: python3 scripts/pull_registry.py --quiet
      - name: Commit registry changes (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add data/registry data/sites.yaml data/changes.yaml data/changes.xml CHANGELOG.md
          git diff --cached --quiet || git commit -m "registry: nightly refresh $(date -u +%F)"
          git push
      - name: Comment on per-trial issues (only when repository variable NOTIFY_ISSUES is true)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.NOTIFY_ISSUES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/notify_issues.py
      - name: Freshness and consistency checks
        run: python3 scripts/check_freshness.py
