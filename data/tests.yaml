# Tests that place a person on a Parkinson's subtype axis.
# Schema: data/SCHEMA.md. Navigation, not medical advice. Unknown is written as null or "unknown", never guessed.

- id: clinical_motor_subtype
  name: Clinical motor subtype (tremor-dominant vs PIGD)
  axis: motor_phenotype
  result_type: categorical (tremor-dominant, PIGD, indeterminate)
  route: Ask the treating neurologist; derived from MDS-UPDRS item ratios
  ordered_by: clinician
  invasiveness: none
  geography: [global]
  cost: Free
  coverage: n/a
  availability: clinical
  unlocks:
    - Deep brain stimulation and focused ultrasound candidacy and expected benefit
    - Prognosis
    - Exercise prescription priority for gait-dominant
  caveats:
    - Subtype can shift over disease course
  verified: 2026-10-19
  sources:
    - research_notes/Parkinsons disease research review/04_motor_treatment_drugs_devices_surgery.md

- id: pd_generation
  name: PD GENEration genetic panel (Parkinson's Foundation)
  axis: genetic
  result_type: 7-gene panel (GBA1, LRRK2, PRKN, SNCA, PINK1, PARK7, VPS35) from whole genome sequencing; some secondary findings
  route: Online consent and survey, then at-home Tasso+ blood kit or site visit; genetic counseling included
  ordered_by: self
  invasiveness: blood
  geography: [US, Canada, Puerto Rico, Dominican Republic, Chile, Mexico, Israel]
  cost: Free
  coverage: n/a
  availability: clinical
  unlocks:
    - GBA1 trials (ASPro-PD UK, GREAT NL)
    - PPMI genetic cohort eligibility
    - Cognition monitoring plan if GBA1
    - Relatives' decision about testing
  caveats:
    - Requires confirmed PD diagnosis and age 18+
    - At-home kit only in US, Canada, Puerto Rico, Dominican Republic
    - About 12 to 13 percent positive overall (12.2 percent per the Foundation FAQ; about 13 percent in the 2026 preprint); about 18 percent with early onset, high-risk ancestry or an affected first-degree relative
  turnaround: About 2 months after the sample reaches the lab; lab report typically 4 to 6 weeks, then a counseling call
  verified: 2026-10-19
  sources:
    - https://www.parkinson.org/advancing-research/our-research/pdgeneration/faq
    - https://www.medrxiv.org/content/10.64898/2026.05.20.26353696v1.full
    - https://www.neurologylive.com/view/expanding-access-parkinson-disease-research-through-at-home-genetic-testing

- id: nhs_genetic_test
  name: NHS clinical genetic testing for Parkinson's (UK)
  axis: genetic
  result_type: clinical gene panel
  route: Referral by neurology, clinical genetics or psychiatry under the National Genomic Test Directory
  ordered_by: clinician
  invasiveness: blood
  geography: [England, Wales, Scotland, Northern Ireland]
  cost: Free at point of care
  coverage: NHS
  availability: clinical
  unlocks:
    - Same as pd_generation
  turnaround: unknown (NHS genomic turnaround not located)
  caveats:
    - Eligibility is onset before 50, a first-degree relative with onset before 50, or complex features
    - Exact R-code not confirmed; check eligibility document v9.1 (May 2026)
  verified: 2026-10-19
  sources:
    - https://www.parkinsons.org.uk/professionals/resources/referring-people-parkinsons-for-genetic-testing
    - https://england.nhs.uk/publication/national-genomic-test-directories

- id: pd_frontline
  name: PD Frontline (UK research genetic study)
  axis: genetic
  result_type: LRRK2, GBA1 and other variants
  route: Online questionnaire then saliva kit by post
  ordered_by: self
  invasiveness: sample
  geography: [UK]
  cost: Free
  coverage: n/a
  availability: research_only
  unlocks:
    - Recontact for UK genetic trials
  turnaround: Kit in up to 4 weeks, then 6 to 8 months for sequencing; plan on 7 to 9 months
  caveats:
    - Research study, not an NHS service
    - Current page gives ages 18 to 90; earlier materials prioritised 35 to 75 diagnosed within 7 years
    - Slow enough to matter when a trial needs the result; see guide/get-typed.md
  verified: 2026-10-19
  sources:
    - https://www.parkinsons.org.uk/node/1011021

- id: consumer_23andme
  name: 23andMe Parkinson's genetic health risk report
  axis: genetic
  result_type: two variants only (LRRK2 G2019S, GBA N370S/N409S)
  route: Consumer kit, Health + Ancestry service
  ordered_by: self
  invasiveness: sample
  geography: [US, and other markets where the health service is sold]
  cost: Kit price
  coverage: none
  availability: consumer
  unlocks:
    - A positive is a lead to confirm with a clinical panel and counseling
  caveats:
    - A negative rules out almost nothing; most pathogenic variants are not tested
    - Best studied in European, Ashkenazi Jewish and North African Berber ancestry
  verified: 2026-10-19
  sources:
    - https://www.23andme.com/topics/health-predispositions/parkinsons-disease/
    - https://medical.23andme.com/wp-content/uploads/2023/02/Jamie-Parkinsons-Disease-one-variant-LRRK2-detected-sample-report-1.pdf

- id: csf_saa
  name: CSF alpha-synuclein seed amplification assay (SYNTap / SAAmplify-aSYN, Amprion)
  axis: synuclein
  result_type: binary (positive/negative), qualitative
  route: Clinician orders; lumbar puncture; CPT 0393U
  ordered_by: clinician
  invasiveness: lumbar_puncture
  geography: [US]
  cost: About USD 1,500 self-pay per a news report; current 2026 price unverified
  coverage: Medicare requires an Advance Beneficiary Notice; not in network with private insurers per manufacturer FAQ; courtesy billing offered
  availability: clinical
  turnaround: unknown
  unlocks:
    - Anchors S+ or S- in biological staging
    - Negative result prompts diagnostic re-look
  negative_means: Does not rule out Parkinson's. About 10 to 15 percent of people with a confident clinical diagnosis test negative; they are disproportionately LRRK2 or Parkin carriers and people with normal smell, plus some with look-alike conditions such as PSP. Standard treatment still works. The useful next questions are genetic testing and a second look at the diagnosis with the neurologist.
  caveats:
    - 87.7 percent sensitivity, 96.3 percent specificity for clinical PD in PPMI (Siderowf 2023); positivity about 68 percent in LRRK2 carriers and about 78 percent in people with normal smell (figures from secondary summaries, unverified against the paper)
    - CPT code 0393U per payer policy documents
    - Does not separate PD from MSA or DLB
    - No disease-modifying trial yet enrolls on this alone
    - FDA Breakthrough Device designation and 2024 Letter of Support; not FDA approved as a diagnostic
  verified: 2026-10-19
  sources:
    - https://www.ampriondx.com/test-faq
    - https://doi.org/10.1016/S1474-4422(23)00109-6
    - https://www.premera.com/medicalpolicies/2.04.521.pdf
    - https://news.mayocliniclabs.com/2025/03/26/mayo-clinic-laboratories-and-amprion-announce-collaboration-to-advance-neurodegenerative-disease-diagnostics/

- id: skin_biopsy_syn_one
  name: Skin biopsy for phosphorylated alpha-synuclein (Syn-One, CND Life Sciences)
  axis: synuclein
  result_type: binary (positive/negative)
  route: Clinician orders; three 3 mm punch biopsies under local anesthetic; report in about 3 weeks
  ordered_by: clinician
  invasiveness: biopsy
  geography: [US]
  cost: Not published
  coverage: Varies by payer; lab-developed test, not FDA cleared
  availability: clinical
  turnaround: About 3 weeks
  unlocks:
    - Same as csf_saa without the lumbar puncture
  negative_means: Same interpretation as a negative CSF assay. The skin test and the CSF test measure the same biology by different methods, and a negative on one is not a reason to assume a positive on the other.
  caveats:
    - 92.7 percent positive in PD, 3.3 percent in controls (JAMA 2024). This is a positivity rate in a clinically confirmed cohort, not the same study as the CSF figures, so the two tests are not directly compared
    - Different method from the seed amplification assay: immunostaining for phosphorylated synuclein in skin nerve fibers, not amplification
    - Does not distinguish among synucleinopathies; no prognosis
  verified: 2026-10-19
  sources:
    - https://cndlifesciences.com/syn-one-test/
    - https://jamanetwork.com/journals/jama/fullarticle/2816441

- id: datscan
  name: Dopamine transporter SPECT (DaTscan)
  axis: neurodegeneration
  result_type: binary-ish (dopaminergic deficit present/absent) with pattern
  route: Clinician orders; nuclear medicine
  ordered_by: clinician
  invasiveness: imaging
  geography: [US, Europe, widely]
  cost: unknown
  coverage: Usually covered when clinically indicated in the US (unverified)
  availability: clinical
  turnaround: Same day imaging; report within days
  unlocks:
    - Confirms the N axis in biological staging
  caveats:
    - Does not subtype; does not separate PD from atypical parkinsonism
    - Provided free inside PPMI
  verified: 2026-10-19
  sources:
    - research_notes/Parkinsons disease research review/03_diagnosis_biomarkers_staging.md

