# Registries, cohorts and testing programs that onboard people into Parkinson's research.
# Schema: data/SCHEMA.md. Navigation, not medical advice. Unknown is null or "unknown", never guessed.

- id: pd_generation
  name: PD GENEration
  sponsor: Parkinson's Foundation
  type: genetic_testing
  eligibility:
    - Confirmed Parkinson's diagnosis
    - Age 18 or older
    - Prior genetic testing elsewhere does not exclude
  countries: [United States, Canada, Puerto Rico, Dominican Republic, Chile, Mexico, Israel]
  at_home: true (United States, Canada, Puerto Rico, Dominican Republic only; in-person sites elsewhere)
  cost: Free, including genetic counseling
  genes: [GBA1, LRRK2, PRKN, SNCA, PINK1, PARK7, VPS35]
  burden: One blood sample (at-home Tasso+ kit or site visit), one short survey, one genetic counseling session
  gives_participant:
    - Seven-gene panel result from whole genome sequencing
    - Genetic counseling
  excludes_from_other_studies: false
  how_to_join: Enroll online at https://www.parkinson.org/advancing-research/our-research/pdgeneration, or email Genetics@Parkinson.org for a virtual appointment
  contact_email: genetics@parkinson.org
  turnaround: "About 2 months after the sample reaches the lab (Foundation page); the lab report itself is typically 4 to 6 weeks (2026 protocol preprint). Then a counseling call."
  registry_id: NCT04057794
  status: recruiting
  url: https://www.parkinson.org/advancing-research/our-research/pdgeneration
  yield_note: About 12 to 13 percent of participants carry a reportable variant (12.2 percent per the Foundation FAQ; about 13 percent in the 2026 preprint); about 18 percent with early onset, high-risk ancestry or an affected first-degree relative
  verified: 2026-10-19
  sources:
    - https://www.parkinson.org/advancing-research/our-research/pdgeneration/faq
    - https://www.medrxiv.org/content/10.64898/2026.05.20.26353696v1.full
    - https://www.neurologylive.com/view/expanding-access-parkinson-disease-research-through-at-home-genetic-testing

- id: ppmi_clinic
  name: PPMI in-clinic cohort (Parkinson's Precision Medicine Initiative, formerly Progression Markers Initiative)
  sponsor: Michael J. Fox Foundation
  type: observational_cohort
  eligibility:
    - Recently diagnosed PD not yet on medication
    - People with REM sleep behavior disorder
    - Known carriers of PD-linked genetic variants (LRRK2, GBA1, SNCA and others)
    - Control volunteers age 40 and older
    - Ashkenazi Jewish participants specifically sought
  countries: [United States, Canada, United Kingdom, Germany, Spain, Italy, Austria, Greece, Netherlands, Luxembourg, Israel, Nigeria]
  sites_file: data/program_sites.yaml (50 sites with city, institution and lead investigator, pulled from ppmi-info.org)
  at_home: false
  cost: Free; study procedures are provided at no cost
  genes: null
  burden: Visits every 6 to 12 months; lumbar puncture, DaTscan, MRI, blood. MRI matters for anyone with an implanted device.
  gives_participant:
    - CSF alpha-synuclein seed amplification result
    - Dopaminergic imaging
    - Site coordinators who know which local drug trials are opening
  excludes_from_other_studies: false
  how_to_join: "US and Canada: start at https://www.mysmelltest.org/site or call 877-525-PPMI (877-525-7764), which routes you to the nearest of 33 North American sites. Elsewhere: contact the site directly; coordinator contacts below."
