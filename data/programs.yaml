# Registries, cohorts and testing programs that onboard people into Parkinson's research.
# Schema: data/SCHEMA.md

- id: pd_generation
  name: PD GENEration
  sponsor: Parkinson's Foundation
  type: genetic_testing
  eligibility:
    - Confirmed Parkinson's diagnosis
    - Age 18 or older
    - Prior genetic testing elsewhere does not exclude
  geography: [US, Canada, Puerto Rico, Dominican Republic, Chile, Mexico, Israel]
  burden: One blood sample (at home or at a site), one survey, one genetic counseling session
  gives_participant:
    - 7-gene panel result
    - Genetic counseling
  excludes_from_other_studies: false
  registry_id: NCT04057794
  status: recruiting
  url: https://www.parkinson.org/advancing-research/our-research/pdgeneration
  verified: 2026-10-19
  sources:
    - https://www.parkinson.org/advancing-research/our-research/pdgeneration/faq
    - https://www.medrxiv.org/content/10.64898/2026.05.20.26353696v1.full

- id: ppmi_clinic
  name: PPMI in-clinic cohort (Parkinson's Precision Medicine Initiative, formerly Progression Markers Initiative)
  sponsor: Michael J. Fox Foundation
  type: observational_cohort
  eligibility:
    - Recently diagnosed PD not yet on medication
    - People with REM sleep behavior disorder
    - Known carriers of PD-linked genetic variants
    - Control volunteers
    - Ashkenazi Jewish participants specifically sought
  geography: [US, and about 50 sites in 12 countries]
  burden: Visits every 6 to 12 months; lumbar puncture, DaTscan, MRI, blood
  gives_participant:
    - CSF alpha-synuclein seed amplification result
    - Dopaminergic imaging
    - Access to site coordinators who know local trial openings
  excludes_from_other_studies: false
  registry_id: null
  status: recruiting
  url: https://michaeljfox.org/ppmi
  verified: 2026-10-19
  sources:
    - https://michaeljfox.org/ppmi
    - research_notes/Parkinsons disease research review/10_history_and_research_infrastructure.md

- id: ppmi_online
  name: PPMI Online / myPPMI
  sponsor: Michael J. Fox Foundation
  type: online_registry
  eligibility:
    - Age 18 or older in the US, with or without Parkinson's
  geography: [US]
  burden: Online questionnaires
  gives_participant: []
  excludes_from_other_studies: false
  registry_id: NCT05065060
  status: recruiting (estimated primary completion December 2041)
  url: https://michaeljfox.org/ppmi
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT05065060

- id: ppmi_smell_test
  name: PPMI smell test screening
  sponsor: Michael J. Fox Foundation
  type: observational_cohort
  eligibility:
    - Over 40 without a Parkinson's diagnosis, or over 30 and diagnosed within the past 7 years
  geography: [US, Canada]
  burden: One mailed scratch-and-sniff test, results entered online
  gives_participant:
    - Possible invitation to in-clinic assessment
  excludes_from_other_studies: false
  registry_id: null
  status: recruiting
  url: https://michaeljfox.org/ppmi
  verified: 2026-10-19
  sources:
    - https://michaeljfox.org/ppmi

- id: fox_insight
  name: Fox Insight
  sponsor: Michael J. Fox Foundation
  type: online_registry
  eligibility:
    - People with Parkinson's and family members
  geography: [global, online]
  burden: Online questionnaires every 90 days plus one-time topic surveys
  gives_participant: []
  excludes_from_other_studies: false
  registry_id: null
  status: active (about 56,000 participants, October 2026); relationship to myPPMI not confirmed
  url: https://foxinsight.michaeljfox.org/
  verified: 2026-10-19
  sources:
    - https://foxinsight.michaeljfox.org/

- id: pd_frontline
  name: PD Frontline
  sponsor: UCL / Parkinson's UK
  type: genetic_testing
  eligibility:
    - Formal Parkinson's diagnosis
    - Prioritising ages 35 to 75 diagnosed within 7 years
  geography: [UK]
  burden: Online questionnaire, saliva kit by post
  gives_participant:
    - Genetic result and recontact for trials
  excludes_from_other_studies: false
  registry_id: null
  status: recruiting
  url: https://www.parkinsons.org.uk/node/1011021
  verified: 2026-10-19
  sources:
    - https://www.parkinsons.org.uk/node/1011021

- id: fox_trial_finder
  name: Fox Trial Finder
  sponsor: Michael J. Fox Foundation
  type: matching_service
  eligibility:
    - Anyone, with or without Parkinson's
  geography: [US primarily]
  burden: Build a profile online
  gives_participant:
    - Trial matches by location and history
  excludes_from_other_studies: false
  registry_id: null
  status: active
  url: https://www.michaeljfox.org/trial-finder
  verified: 2026-10-19
  sources:
    - https://www.michaeljfox.org/sites/default/files/media/document/A-Preliminary-Analysis-of-Fox-Trial-Finder.pdf
