- id: pd_frontline
  name: PD Frontline (part of RAPSODI GD)
  sponsor: UCL / Parkinson's UK
  type: genetic_testing
  eligibility:
    - Formal Parkinson's diagnosis, living in the UK, age 18 to 90
    - Earlier materials said priority for ages 35 to 75 diagnosed within 7 years; the current Parkinson's UK page gives only the 18 to 90 range
  countries: [United Kingdom]
  at_home: true
  cost: Free
  genes: [LRRK2, GBA1, and others; full panel not published]
  burden: Online questionnaire, then two kits by post for saliva and blood samples, returned in pre-paid packaging
  gives_participant:
    - Genetic result (the team contacts you when ready) and recontact for trials, named explicitly as ASPro-PD
  excludes_from_other_studies: false
  how_to_join: https://www.parkinsons.org.uk/research/projects/pd-frontline-identifying-genes-people-parkinsons
  registry_id: NCT06151002
  status: recruiting
  url: https://www.parkinsons.org.uk/research/projects/pd-frontline-identifying-genes-people-parkinsons
  turnaround: "Kit arrives in up to 4 weeks; the team allows 6 to 8 months for sequencing. Plan on about 7 to 9 months from sign-up to result."
  verified: 2026-10-19
  sources:
    - https://www.parkinsons.org.uk/research/projects/pd-frontline-identifying-genes-people-parkinsons
    - https://clinicaltrials.gov/study/NCT06151002
    - https://services.nhslothian.scot/neuroprogressiveanddementianetwork/pd-frontline/

