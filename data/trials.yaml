    notes: Have daily OFF hours and years since diagnosis ready; both are entry criteria.
  enrollment_target: 102
  primary_completion: 2027-03
  registry_last_updated: 2026-08-04
  background: Phase 1 (12 participants) showed no tumours or graft-induced dyskinesia and about one hour more good ON time at 3 years, open-label. Sham-controlled cell therapy has failed under blinding before (Freed 2001, Olanow 2003). Primary endpoint is change in ON time without troublesome dyskinesia at week 78. First participant randomized and operated August 2025.
  verified: 2026-10-20
  sources:
