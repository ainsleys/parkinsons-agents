  registry_id: ISRCTN17799294
  other_ids: null
  sponsor: UCL (MRC CTU; Edmond J. Safra Foundation and Cure Parkinson's funding)
  phase: "3 platform (multi-arm multi-stage)"
  intervention: Telmisartan 40 mg or terazosin 5 mg daily vs shared placebo, in addition to standard care; ursodeoxycholic acid arm planned for 2026
  target_axis: none (PD on medication, diagnosed at 30 or older)
  status: recruiting
  status_note: Derived from ISRCTN recruitment dates 2025-09-01 to 2029-06-30; Cure Parkinson's announced recruitment open in October 2025
  countries: [United Kingdom]
  sites: 43
  eligibility:
    age_min: 30
    age_max: null
    duration_min_months: null
    duration_max_months: null
    duration_reference: unknown
    hoehn_yahr_min: null
    hoehn_yahr_max: null
    hoehn_yahr_state: "unknown"
    medication_state: on_stable_treatment
    medication_min_months: 2
    motor_complications_allowed: unknown
    motor_complications_required: false
    genetic_requirement: {required_variant: none, status_must_be_known: false, excluded_variants: [PRKN, PINK1, PARK7 (known recessive carriers)]}
    smoking_allowed: unknown
    cognition: MoCA 21 or above; no dementia
    other:
      - Clinically established or probable PD, diagnosed at age 30 or older, no upper age limit
      - On levodopa or a dopamine agonist for at least 2 months; MAO-B inhibitor monotherapy excluded
      - Excludes atypical parkinsonism, prior or planned brain surgery or infusion therapy, another interventional trial within 6 months
