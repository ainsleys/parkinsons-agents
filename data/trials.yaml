- id: beacon
  name: BEACON
  registry_id: NCT06602193
  sponsor: Denali Therapeutics
  phase: 2a
  intervention: BIIB122 (DNL151), LRRK2 kinase inhibitor
  target_axis: genetic (LRRK2 variant carriers only)
  status: active_not_recruiting
  geography: [US]
  sites: null
  eligibility:
    genetic_requirement: heterozygous or homozygous LRRK2 pathogenic variant
    other: []
  burden:
    route: oral
    mri_required: unknown
  primary_completion: 2027-03
  background: The only remaining clinical test of the LRRK2 hypothesis after LUMA failed in idiopathic PD (May 2026). Data expected first half of 2027.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT06602193
    - https://www.globenewswire.com/news-release/2026/05/21/3299820/0/en/Biogen-and-Denali-Therapeutics-Provide-Update-on-Phase-2b-LUMA-Study-of-BIIB122-DNL151-in-Early-Stage-Parkinson-s-Disease.html

