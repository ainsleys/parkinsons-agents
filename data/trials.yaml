    frequency: daily
    blinded_duration_weeks: 156
    open_label_extension: unknown
    placebo_probability: unknown (three arms, shared placebo)
    mri_required: unknown
    surgery: false
  contact:
    preferred_route: Ask your neurologist or Parkinson's nurse to refer you to the nearest participating NHS site, or email the trial team
    email: mrcctu.ejsactpd@ucl.ac.uk
    registry_url: https://www.isrctn.com/ISRCTN17799294
    sponsor_page: https://www.mrcctu.ucl.ac.uk/studies/all-studies/e/ejs-act-pd/
    notes: UK NHS trial. Screening is in person; later visits can be remote. Site list in data/sites.yaml.
  enrollment_target: 1200
  primary_completion: 2029-06
  registry_last_updated: null
