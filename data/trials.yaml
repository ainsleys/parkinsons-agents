- id: beacon
  name: BEACON
  registry_id: NCT06602193
  sponsor: Denali Therapeutics
  phase: 2a
  intervention: BIIB122 (DNL151), LRRK2 kinase inhibitor
  target_axis: genetic (LRRK2 pathogenic variant carriers only)
  status: active_not_recruiting
  geography: [4 countries including US]
  sites: 20
  eligibility:
    age_min: 30
    age_max: 80 for heterozygous carriers; none for homozygous
    disease_duration_min_months: null
    disease_duration_max_months: null
    hoehn_yahr: unknown
    medication_state: unknown
    genetic_requirement: pathogenic LRRK2 variant confirmed on screening test
    other:
      - PD by MDS criteria
      - Excludes prior LUMA participants, gene therapy participants, prior brain surgery for PD
      - Excludes abnormal pulmonary function tests or vitals
  burden:
    route: oral
    frequency: daily
    blinded_duration_weeks: unknown
    open_label_extension: unknown
    placebo_probability: unknown
    mri_required: unknown
  enrollment_target: 50
  primary_completion: 2027-03
  registry_last_updated: 2026-05-27
  background: The only remaining clinical test of the LRRK2 hypothesis after LUMA failed in idiopathic PD (May 2026). Data expected first half of 2027.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT06602193
    - https://www.globenewswire.com/news-release/2026/05/21/3299820/0/en/Biogen-and-Denali-Therapeutics-Provide-Update-on-Phase-2b-LUMA-Study-of-BIIB122-DNL151-in-Early-Stage-Parkinson-s-Disease.html

- id: propel
  name: PROPEL
  registry_id: NCT04127578
  sponsor: Prevail Therapeutics / Eli Lilly
  phase: 1/2a
  intervention: PR001 / LY3884961, AAV9-GBA1 gene therapy, single intracisternal injection with immunosuppression
  target_axis: genetic (GBA1 PD, moderate to severe)
  status: active_not_recruiting
  geography: [US and one other country]
  sites: 15
  eligibility:
    age_min: 35
    age_max: 80
    disease_duration_min_months: null
    disease_duration_max_months: null
    hoehn_yahr: "3 to 4 off medication"
    medication_state: stable background medication for at least 8 weeks
    genetic_requirement: at least one pathogenic GBA1 variant confirmed by central lab
    other:
      - Weight 40 to 110 kg; BMI 18 to 34
      - Requires a study partner, ambulatory without walker, living in the community, MoCA 14 or above
      - Excludes prior DBS, focused ultrasound, PD surgery, any gene or cell therapy, ambroxol within 8 weeks
      - Excludes MRI contraindications, blood thinners, many cardiac, hepatic, infectious and psychiatric conditions
      - Requires pneumococcal and shingles vaccination and TB screening
  burden:
    route: intracisternal injection under anesthesia plus immunosuppression; lumbar punctures; long-term follow-up
    frequency: single dose
    blinded_duration_weeks: 0
    open_label_extension: n/a (open-label)
    placebo_probability: 0
    mri_required: true
  enrollment_target: 32
  primary_completion: 2031-08-31
  registry_last_updated: 2026-10-13
  background: Sham arm removed and immunosuppression enhanced after an early immune-related serious adverse event.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT04127578

- id: luma
  name: LUMA
  registry_id: NCT05348785
  sponsor: Biogen / Denali
  phase: 2b
  intervention: BIIB122 (DNL151), LRRK2 kinase inhibitor, oral
  target_axis: none (early idiopathic PD, ages 30 to 80, within 2 years of diagnosis)
  status: failed
  geography: []
  sites: null
  eligibility: {}
  burden: {}
  enrollment_target: 650
  primary_completion: 2026-03-09
  registry_last_updated: 2026-06-04
  background: Completed March 2026, reported May 2026. No efficacy signal on primary or secondary endpoints despite over 90 percent peripheral kinase inhibition; development in idiopathic PD discontinued. A companion phase 3 in LRRK2 carriers (LIGHTHOUSE, NCT05418673) was terminated in 2023 after enrolling 7.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT05348785
    - https://www.neurologylive.com/view/lrrk2-inhibitor-biib122-fails-slow-early-stage-parkinson-disease
