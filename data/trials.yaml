# Disease-modifying and notable trials in Parkinson's as of 2026-10-19.
# Schema and matching rules: data/SCHEMA.md. Navigation, not medical advice.
# Structured fields come from ClinicalTrials.gov (v2 API) and ISRCTN records pulled on 2026-10-19
# (raw records in data/registry/, site lists in data/sites.yaml, refreshed by scripts/pull_registry.py).
# Registries list key criteria only; every trial applies further protocol-defined criteria at screening.
# Unknown is null or "unknown", never guessed.

- id: paraiso
  name: PARAISO
  registry_id: NCT07174310
  other_ids: null
  sponsor: Hoffmann-La Roche (with Prothena)
  phase: "3"
  intervention: Prasinezumab, anti-alpha-synuclein monoclonal antibody, IV every 4 weeks
  target_axis: none (early idiopathic PD on stable symptomatic monotherapy; no genetic or synuclein requirement)
  status: recruiting
  status_note: null
  countries: [United States, China, Germany, Italy, Spain, France, Poland, Brazil, Australia, Portugal, United Kingdom, South Korea, Taiwan, Austria, Canada, Denmark, Mexico]
  sites: 192
  eligibility:
    age_min: 50
    age_max: 85
    duration_min_months: 3
    duration_max_months: 36
    duration_reference: diagnosis
    hoehn_yahr_min: 1
    hoehn_yahr_max: 2
    hoehn_yahr_state: "off"
    medication_state: on_stable_treatment
    medication_min_months: null
    motor_complications_allowed: false
    motor_complications_required: false
    genetic_requirement: {required_variant: none, status_must_be_known: false, excluded_variants: []}
    smoking_allowed: unknown
    weight_kg_min: 40
    weight_kg_max: 110
    bmi_min: 18
    bmi_max: 34
    cognition: null
    other:
      - Idiopathic PD by MDS criteria
      - Registry says "has received monotherapy treatment"; site listings say levodopa monotherapy
      - MDS-UPDRS Part IV score 0 at screening and randomization
      - Weight 40 to 110 kg; BMI 18 to 34
      - Excludes other parkinsonian syndromes, significant other neurologic disease, chronic uncontrolled hypertension, pregnancy
    notes: The 3 to 36 month duration window comes from site listings, not the registry record. The registry does not state a minimum time on medication.
  burden:
    route: IV infusion
    frequency: every 4 weeks
    blinded_duration_weeks: 104
    open_label_extension: true
    placebo_probability: 0.5
    mri_required: likely
    surgery: false
  contact:
    preferred_route: US residents, Genentech "Submit a Medical or Clinical Trial Inquiry" form or the Clinical Trial Information line; outside the US, the study page on forpatients.roche.com has contact-the-study and request-a-callback forms
    inquiry_form: https://www.gene.com/contact-us/submit-medical-inquiry
    portal: https://forpatients.roche.com/
    email: global-roche-genentech-trials@gene.com
    phone: "888-662-6728 (US and Canada; Monday to Friday, 5am to 5pm Pacific)"
    reference: Study BN44715
    per_site_contacts: none published; the sponsor routes inquiries centrally and connects you to the nearest site
    registry_url: https://clinicaltrials.gov/study/NCT07174310
    notes: Verified 2026-10-19 by reading both pages. The Genentech form is for US residents and asks patients to consult their physician or submit a question; the registry says no attachments to the email and that the form gets the fastest response. ForPatients asks for initials only and no addresses or birthdays.
  enrollment_target: 900
  primary_completion: 2029-06-30
  registry_last_updated: 2026-10-06
  background: Phase 2b PADOVA missed its primary endpoint (HR 0.84, p 0.066); prespecified levodopa-treated subgroup HR 0.79. The only anti-synuclein agent with a replicated directional signal.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT07174310
    - research_notes/Parkinsons disease research review/06_disease_modifying_therapy_pipeline.md

- id: aspro_pd
  name: ASPro-PD
  registry_id: NCT05778617
  other_ids: null
  sponsor: University College London (Cure Parkinson's, Van Andel Institute funding)
  phase: "3"
  intervention: Ambroxol 1,260 mg per day oral, GBA1 chaperone, vs placebo
  target_axis: genetic (GBA1 status must be known; carriers and non-carriers both enrolled)
  status: recruiting
  status_note: Registry record last updated 2025-05-01; Cure Parkinson's reported 15 sites open and screening in 2026. Recruitment planned over 2 years from the first site opening in February 2025, "recruiting until 2027" per the sponsor FAQ; no exact close date published.
  countries: [United Kingdom]
  sites: 15
  eligibility:
    age_min: 35
    age_max: 75
    duration_min_months: null
    duration_max_months: 84
    duration_reference: diagnosis
    hoehn_yahr_min: 1
    hoehn_yahr_max: 2.5
    hoehn_yahr_state: "on"
    medication_state: on_stable_treatment
    medication_min_months: 3
    motor_complications_allowed: unknown
    motor_complications_required: false
    genetic_requirement: {required_variant: none, status_must_be_known: true, excluded_variants: [LRRK2 G2019S], route: "PD Frontline only. The sponsor FAQ: all recruitment to ASPro-PD comes from people who have taken part in PD Frontline; a GBA1 result from another lab does not qualify. Participants are invited by the trial team once results are shared."}
    smoking_allowed: unknown
    cognition: MoCA 20 or above
    other:
      - PD by MDS criteria diagnosed within 7 years
      - GBA1 status confirmed before screening (positive or negative both accepted)
      - Excludes prior deep brain stimulation
      - Excludes ambroxol or a GLP-1 agonist (exenatide) in the past 12 months
      - Excludes another disease-modifying investigational drug within 12 months
      - Excludes BDI-II above 20, dysphagia, creatinine clearance below 50
      - Excludes trihexyphenidyl or benztropine within 30 days
      - Optional CSF sub-study with lumbar puncture
    notes: null
  burden:
    route: oral
    frequency: daily
    blinded_duration_weeks: 104
    open_label_extension: true
    placebo_probability: 0.5
    mri_required: unknown
    surgery: false
  contact:
    preferred_route: Register with PD Frontline first; the ASPro-PD team invites eligible people once genetic results are shared. Questions to the trial team by email or phone; the FAQ says people who have not done PD Frontline cannot be enrolled
    email: cctu.aspro-pd@ucl.ac.uk
    phone: "020 3108 4908"
    genetic_route_contact: pdfrontline@ucl.ac.uk
    per_site_contacts: named principal investigators per site in data/contacts.yaml, without direct phone or email
    registry_url: https://clinicaltrials.gov/study/NCT05778617
    notes: Verified 2026-10-20 against the Cure Parkinson's FAQ (April 2025) and the protocol paper. GBA1 status comes through PD Frontline, which can take up to a year; a paid private panel does not substitute. Recruiting until 2027.
  enrollment_target: 330
  primary_completion: 2029-02
  registry_last_updated: 2025-05-01
  background: Open-label AiM-PD (2020) showed CNS penetration and motor improvement; ambroxol missed primary endpoints in PD dementia (2025). The last large randomized test of GCase enhancement before gene therapy data.
  verified: 2026-10-20
  sources:
    - https://clinicaltrials.gov/study/NCT05778617
    - https://pubmed.ncbi.nlm.nih.gov/41708985/
    - https://cureparkinsons.org.uk/2025/04/the-aspro-pd-trial-is-now-underway/

