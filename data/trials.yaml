- id: bhv_8000
  name: BHV-8000 phase 2/3
  registry_id: NCT06976268
  sponsor: Biohaven
  phase: 2/3
  intervention: BHV-8000, oral TYK2/JAK1 inhibitor, vs placebo
  target_axis: none (early, untreated idiopathic PD; immune hypothesis)
  status: recruiting
  geography: [US]
  sites: 24
  eligibility:
    age_min: 40
    age_max: 80
    disease_duration_min_months: null
    disease_duration_max_months: 24
    hoehn_yahr: unknown
    medication_state: not on any PD medication (treatment-naive)
    genetic_requirement: none
    other:
      - Probable PD by MDS criteria with clinician-documented onset within 2 years
      - Excludes current smokers of any kind including e-cigarettes
      - Excludes other parkinsonian syndromes and significant CNS disease
      - Immune suppression risk; infection screening
  burden:
    route: oral
    frequency: daily
    blinded_duration_weeks: 48
    open_label_extension: true
    placebo_probability: unknown
    mri_required: unknown
  enrollment_target: 550
  primary_completion: 2027-08
  registry_last_updated: 2026-09-28
  background: No prior PD efficacy data; novel anti-inflammatory mechanism. Note the untreated requirement, which conflicts with starting levodopa.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT06976268

