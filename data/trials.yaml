- id: bhv_8000
  name: BHV-8000 phase 2/3
  registry_id: NCT06976268
  other_ids: null
  sponsor: Biohaven
  phase: 2/3
  intervention: BHV-8000, oral TYK2/JAK1 inhibitor, vs placebo
  target_axis: none (early, untreated idiopathic PD; immune hypothesis)
  status: recruiting
  status_note: Registry lists 25 US sites (Sun City, Arizona added 2026-10-22); Biohaven's June 2025 release describes about 185 sites in 13 countries, so the registry likely lags. A trial-finder listing describes the primary event as a 2-point or greater worsening on MDS-UPDRS Part II.
  countries: [United States]
  sites: 25
  eligibility:
    age_min: 40
    age_max: 80
    duration_min_months: null
    duration_max_months: 24
    duration_reference: symptom_onset
    hoehn_yahr_min: null
    hoehn_yahr_max: null
    hoehn_yahr_state: "unknown"
    medication_state: untreated
    medication_min_months: null
    motor_complications_allowed: unknown
    motor_complications_required: false
    genetic_requirement: {required_variant: none, status_must_be_known: false, excluded_variants: []}
    smoking_allowed: false
    cognition: null
    other:
      - Probable PD by MDS criteria with clinician-documented onset within 2 years
      - Excludes current smokers of any kind including e-cigarettes
      - Excludes other parkinsonian syndromes and significant CNS disease
      - Immune suppression risk; infection screening
    notes: Registry wording is "onset within 2 years of the Screening Visit", so the reference is symptom onset as documented by a clinician. Whether a participant may start Parkinson's medication after randomization is not stated in the registry or in any public sponsor material we could find (checked 2026-10-20); the primary endpoint is time to a qualifying worsening on MDS-UPDRS Part II over 48 weeks, a design in which starting symptomatic therapy is sometimes counted as a worsening event. Ask the sponsor before enrolling.
  burden:
    route: oral
    frequency: daily
    blinded_duration_weeks: 48
    open_label_extension: true
    placebo_probability: unknown
    mri_required: unknown
    surgery: false
  contact:
    preferred_route: Email or phone the sponsor; sites are not named on the registry and the sponsor connects you
    email: clinicaltrials@biohavenpharma.com
    phone: "203-404-0410"
    per_site_contacts: none published; sites appear as "Site-NNN"
    registry_url: https://clinicaltrials.gov/study/NCT06976268
    notes: Requires being untreated, so discuss timing with your neurologist before making contact.
  enrollment_target: 550
  primary_completion: 2027-08
  registry_last_updated: 2026-10-22
  background: No prior PD efficacy data; novel anti-inflammatory mechanism. The untreated requirement means joining competes with starting levodopa.
  verified: 2026-10-25
  sources:
    - https://clinicaltrials.gov/study/NCT06976268

- id: ejs_act_pd
