- id: luma
  name: LUMA
  registry_id: NCT05418673
  sponsor: Biogen / Denali
  phase: 2b
  intervention: BIIB122 (DNL151), LRRK2 kinase inhibitor
  target_axis: none (early idiopathic PD)
  status: failed
  geography: []
  sites: null
  eligibility: {}
  burden: {}
  primary_completion: 2026
  background: Reported May 2026. No efficacy signal on primary or secondary endpoints despite over 90 percent peripheral kinase inhibition; development in idiopathic PD discontinued.
  verified: 2026-10-19
  sources:
    - https://www.neurologylive.com/view/lrrk2-inhibitor-biib122-fails-slow-early-stage-parkinson-disease
