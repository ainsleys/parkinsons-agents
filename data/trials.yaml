# Pivotal and notable disease-modifying trials in Parkinson's as of October 2026.
# Schema: data/SCHEMA.md. Eligibility fields are for local matching by the person's own agent.
# Structured fields were populated from the ClinicalTrials.gov v2 API on 2026-10-19
# (raw records in data/registry/, refreshed by scripts/pull_registry.py).
# Registries list "key" criteria only; every trial adds protocol-defined criteria at screening.

- id: paraiso
  name: PARAISO
  registry_id: NCT07174310
  sponsor: Hoffmann-La Roche (with Prothena)
  phase: "3"
  intervention: Prasinezumab, anti-alpha-synuclein monoclonal antibody, IV every 4 weeks
  target_axis: synuclein (early idiopathic PD on stable symptomatic monotherapy)
  status: recruiting
  geography: [17 countries including US, UK, Germany]
  sites: 192
  eligibility:
    age_min: 50
    age_max: 85
    disease_duration_min_months: 3
    disease_duration_max_months: 36
    hoehn_yahr: "1 or 2 off medication"
    medication_state: on stable symptomatic monotherapy (registry says "monotherapy"; site listings say levodopa)
    genetic_requirement: none
    other:
      - Idiopathic PD by MDS criteria
      - MDS-UPDRS Part IV score 0 at screening and randomization (no motor complications)
      - Weight 40 to 110 kg; BMI 18 to 34
      - Excludes other parkinsonian syndromes, significant other neurologic disease, chronic uncontrolled hypertension, pregnancy
    notes: Disease duration window (3 months to 3 years) comes from site listings, not the registry record
  burden:
    route: IV infusion
    frequency: every 4 weeks
    blinded_duration_weeks: 104
    open_label_extension: true
    placebo_probability: 0.5
    mri_required: likely
  enrollment_target: 900
  primary_completion: 2029-06-30
  registry_last_updated: 2026-10-06
  background: Phase 2b PADOVA missed its primary endpoint (HR 0.84, p 0.066); prespecified levodopa-treated subgroup HR 0.79. The only anti-synuclein agent with a replicated directional signal.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT07174310
    - research_notes/Parkinsons disease research review/06_disease_modifying_therapy_pipeline.md

- id: aspro_pd
  name: ASPro-PD
  registry_id: NCT05778617
  sponsor: University College London (Cure Parkinson's, Van Andel Institute funding)
  phase: "3"
  intervention: Ambroxol 1,260 mg per day oral, GBA1 chaperone, vs placebo
  target_axis: genetic (GBA1 status must be known; carriers and non-carriers both enrolled)
  status: recruiting
  geography: [UK]
  sites: 15
  eligibility:
    age_min: 35
    age_max: 75
    disease_duration_min_months: null
    disease_duration_max_months: 84
    hoehn_yahr: "1 to 2.5 on medication"
    medication_state: on stable dopaminergic treatment for at least 3 months
    genetic_requirement: GBA1 status confirmed before screening (positive or negative both accepted); LRRK2 G2019S carriers excluded
    other:
      - PD by MDS criteria diagnosed within 7 years
      - Excludes prior deep brain stimulation
      - Excludes ambroxol in past 12 months and exenatide or other GLP-1 agonist in past 12 months
      - Excludes another disease-modifying investigational drug within 12 months
      - Excludes MoCA below 20, BDI-II above 20, dysphagia, creatinine clearance below 50
      - Excludes trihexyphenidyl or benztropine within 30 days
      - Optional CSF sub-study with lumbar puncture
  burden:
    route: oral
    frequency: daily
    blinded_duration_weeks: 104
    open_label_extension: true
    placebo_probability: 0.5
    mri_required: unknown
  enrollment_target: 330
  primary_completion: 2029-02
  registry_last_updated: 2025-05-01
  background: Open-label AiM-PD (2020) showed CNS penetration and motor improvement; ambroxol missed primary endpoints in PD dementia (2025). The last large randomized test of GCase enhancement before gene therapy data.
  verified: 2026-10-19
  sources:
    - https://clinicaltrials.gov/study/NCT05778617
    - https://pubmed.ncbi.nlm.nih.gov/41708985/
    - https://cureparkinsons.org.uk/2025/04/the-aspro-pd-trial-is-now-underway/

